<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitBot Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { tokyo: { bg: '#1a1b26', card: '#1f2335', input: '#24283b', accent: '#7aa2f7', text: '#c0caf5', muted: '#7982a9', green: '#9ece6a' } } } } };</script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #1a1b26; color: #c0caf5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .markdown h2 { color: #7aa2f7; font-size: 1.05rem; font-weight: 700; margin: 1.25rem 0 .6rem; }
    .markdown h2:first-child { margin-top: 0; }
    .markdown p, .markdown li { color: #a9b1d6; line-height: 1.7; font-size: .88rem; }
    .markdown ul { list-style: disc; padding-left: 1.25rem; }
    .markdown pre { background: #16161e; border: 1px solid #292e42; padding: .9rem; overflow-x: auto; margin: .7rem 0; border-radius: .5rem; }
    .markdown code { color: #9ece6a; font-size: .82rem; }
    .markdown p code { background: #24283b; padding: .15rem .3rem; border-radius: .2rem; }
    .chat-scroll::-webkit-scrollbar { width: 6px; } .chat-scroll::-webkit-scrollbar-thumb { background: #3b4261; border-radius: 6px; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-[#292e42] bg-[#1f2335]/90 px-5 py-4 backdrop-blur md:px-8">
    <div class="mx-auto flex max-w-[1500px] flex-col gap-4 lg:flex-row lg:items-center">
      <div class="flex min-w-fit items-center gap-3"><span class="h-3 w-3 animate-pulse rounded-full bg-tokyo-green shadow-[0_0_14px_#9ece6a]"></span><h1 class="text-lg font-bold tracking-tight text-white">GitBot <span class="text-tokyo-accent">Studio</span></h1></div>
      <div class="flex flex-1 gap-2 lg:ml-10"><input id="repoUrl" class="min-w-0 flex-1 rounded-lg border border-[#3b4261] bg-tokyo-input px-4 py-2.5 text-sm text-white outline-none transition focus:border-tokyo-accent" placeholder="https://github.com/owner/repository" type="url" /><button id="analyzeButton" class="rounded-lg bg-tokyo-accent px-5 py-2.5 text-sm font-bold text-[#16161e] transition hover:bg-[#89b4fa] disabled:cursor-wait disabled:opacity-60" onclick="analyzeRepo()">Analyze</button></div>
    </div>
  </header>
  <main class="mx-auto grid max-w-[1500px] gap-5 p-5 md:p-8 lg:grid-cols-[1.15fr_.85fr]">
    <section class="flex min-h-[70vh] flex-col rounded-xl border border-[#292e42] bg-tokyo-card p-5 md:p-7"><div class="mb-5 flex flex-wrap items-center justify-between gap-3"><div><p class="text-xs uppercase tracking-[.2em] text-tokyo-muted">Repository blueprint</p><h2 id="repoName" class="mt-1 text-xl font-bold text-white">Awaiting a repository</h2></div><div id="repoStats" class="hidden items-center gap-2 text-xs"></div></div><div id="blueprint" class="markdown flex-1"><div class="flex h-full min-h-64 items-center justify-center text-center text-sm text-tokyo-muted">Paste a public GitHub URL above to map its architecture.</div></div></section>
    <section class="flex min-h-[70vh] flex-col overflow-hidden rounded-xl border border-[#292e42] bg-tokyo-card"><div class="border-b border-[#292e42] px-5 py-5 md:px-7"><p class="text-xs uppercase tracking-[.2em] text-tokyo-muted">Contextual assistant</p><h2 class="mt-1 text-xl font-bold text-white">Ask GitBot</h2></div><div id="chatMessages" class="chat-scroll flex flex-1 flex-col gap-4 overflow-y-auto p-5 md:p-7"><div class="max-w-[90%] rounded-lg border border-[#3b4261] bg-tokyo-input p-4 text-sm leading-6 text-tokyo-text">Analyze a repository, then ask me about its setup, dependencies, files, or automation.</div></div><div class="border-t border-[#292e42] p-4"><div class="flex gap-2"><input id="questionInput" class="min-w-0 flex-1 rounded-lg border border-[#3b4261] bg-tokyo-input px-4 py-3 text-sm text-white outline-none focus:border-tokyo-accent" placeholder="How do I run the tests?" /><button id="sendButton" class="rounded-lg border border-tokyo-accent px-4 py-3 text-sm font-bold text-tokyo-accent transition hover:bg-tokyo-accent hover:text-[#16161e]" onclick="sendQuestion()">Send</button></div></div></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
